<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>凯莉 · 语音</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
         background:linear-gradient(160deg,#1a1a2e,#16213e); color:#eee;
         height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { padding:18px; text-align:center; width:100%; }
  header h1 { font-size:20px; color:#ffb6c1; letter-spacing:1px; }
  header p { font-size:12px; color:#888; margin-top:4px; }
  #chat { flex:1; width:100%; max-width:520px; overflow-y:auto; padding:10px 16px; display:flex; flex-direction:column; }
  .msg { max-width:85%; margin:8px 0; padding:10px 14px; border-radius:16px; font-size:15px; line-height:1.5; word-break:break-word; }
  .msg.user { background:#2d4a7a; align-self:flex-end; border-bottom-right-radius:4px; }
  .msg.kylie { background:#3a2a4a; align-self:flex-start; border-bottom-left-radius:4px; }
  .msg .time { font-size:10px; color:#999; margin-top:4px; text-align:right; }
  #hold { width:110px; height:110px; border-radius:50%; background:#e0446e; color:#fff;
          border:none; font-size:16px; font-weight:600; margin:16px; box-shadow:0 6px 20px rgba(224,68,110,.4);
          user-select:none; touch-action:none; }
  #hold.recording { background:#c22a52; transform:scale(.94); box-shadow:0 0 0 10px rgba(224,68,110,.2); }
  #status { font-size:12px; color:#aaa; margin-bottom:14px; min-height:16px; }
  .rec-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ff5555; margin-right:5px; animation:blink 1s infinite; }
  @keyframes blink { 50%{opacity:.2} }
  #loading { display:none; font-size:13px; color:#ffb6c1; margin-bottom:10px; }
</style>
</head>
<body>
  <header>
    <h1>💗 凯莉 · 语音</h1>
    <p>按住说话，松开听我回</p>
  </header>
  <div id="chat"></div>
  <div id="status"></div>
  <div id="loading">🔊 凯莉在想…</div>
  <button id="hold">按住说话</button>

<script>
const chat = document.getElementById('chat');
const statusEl = document.getElementById('status');
const loading = document.getElementById('loading');
const btn = document.getElementById('hold');
// 后端 API 地址（VPS 8095，经 cloudflared tunnel 暴露）
const API = 'https://similarly-producing-shot-producing.trycloudflare.com';
let mediaRecorder = null, chunks = [], stream = null;

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  const t = document.createElement('div');
  t.className = 'time';
  t.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  d.appendChild(t);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function startRec() {
  chunks = [];
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  } catch(e) {
    statusEl.textContent = '需要麦克风权限 ' + e.message;
    return;
  }
  const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
  mediaRecorder = new MediaRecorder(stream, {mimeType:mime});
  mediaRecorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  mediaRecorder.start();
  btn.classList.add('recording');
  statusEl.innerHTML = '<span class="rec-dot"></span>正在听你说…';
}

async function stopRec() {
  return new Promise(resolve => {
    mediaRecorder.onstop = async () => {
      const blob = new Blob(chunks, {type:mediaRecorder.mimeType});
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove('recording');
      statusEl.textContent = '';
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

async function send(blob) {
  const fd = new FormData();
  const ext = blob.type.includes('ogg') ? 'ogg' : 'webm';
  fd.append('file', blob, 'voice.' + ext);
  loading.style.display = 'block';
  try {
    const res = await fetch(API + '/voice', {method:'POST', body:fd});
    const data = await res.json();
    loading.style.display = 'none';
    if(data.error) { addMsg('⚠️ ' + data.error, 'kylie'); return; }
    addMsg(data.text, 'user');
    addMsg(data.reply, 'kylie');
    const audio = new Audio(API + data.audio_url);
    audio.play().catch(e => {
      statusEl.textContent = '点屏幕任意处播放';
      const tap = () => { audio.play(); document.removeEventListener('touchstart', tap); };
      document.addEventListener('touchstart', tap, {once:true});
    });
  } catch(e) {
    loading.style.display = 'none';
    addMsg('⚠️ 连接失败: ' + e.message, 'kylie');
  }
}

btn.addEventListener('mousedown', startRec);
btn.addEventListener('mouseup', async () => { const b = await stopRec(); if(b.size) send(b); });
btn.addEventListener('touchstart', e => { e.preventDefault(); startRec(); }, {passive:false});
btn.addEventListener('touchend', async e => { e.preventDefault(); const b = await stopRec(); if(b.size) send(b); }, {passive:false});
</script>
</body>
</html>
